<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 520" width="1800" height="520">
  <defs>
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8a1912"/>
      <stop offset="50%" stop-color="#3a0d08"/>
      <stop offset="100%" stop-color="#1a0604"/>
    </linearGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff0b8"/>
      <stop offset="50%" stop-color="#e0b452"/>
      <stop offset="100%" stop-color="#9c6e1e"/>
    </linearGradient>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="50%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Left 3D Squircle Emblem -->
  <g transform="translate(45, 40)" filter="url(#shadow)">
    <rect x="0" y="0" width="440" height="440" rx="96" fill="url(#iconBg)" stroke="url(#goldBorder)" stroke-width="10"/>
    <rect x="20" y="20" width="400" height="400" rx="80" fill="none" stroke="#fde68a" stroke-width="2" opacity="0.35"/>
    <!-- Stylized Golden S-Shaped Map -->
    <path d="M 155 75 L 220 65 L 270 85 L 285 120 L 250 158 L 210 175 L 265 245 L 292 292 L 282 348 L 235 375 L 175 395 L 152 365 L 185 320 L 222 292 L 205 242 L 165 180 L 130 142 Z"
          fill="url(#goldText)" stroke="#fffbeb" stroke-width="3"/>
    <circle cx="332" cy="240" r="6" fill="#fde047"/>
    <circle cx="348" cy="234" r="5" fill="#fde047"/>
    <circle cx="342" cy="252" r="4.5" fill="#fde047"/>
    <circle cx="335" cy="332" r="6" fill="#fde047"/>
    <circle cx="354" cy="325" r="5" fill="#fde047"/>
    <circle cx="348" cy="344" r="5" fill="#fde047"/>
  </g>

  <!-- Right Wordmark (Evergreen - Zero Version Numbers) -->
  <g transform="translate(535, 130)" filter="url(#shadow)">
    <rect x="0" y="0" width="460" height="50" rx="25" fill="#7d1812" stroke="url(#goldBorder)" stroke-width="2.5"/>
    <text x="230" y="33" font-family="'Segoe UI', Arial, sans-serif" font-size="22" font-weight="900" fill="#fde68a" text-anchor="middle" letter-spacing="2">
      AUTO STUDIO • TIKTOK LIVE 9:16
    </text>

    <text x="0" y="155" font-family="'Segoe UI', Arial, sans-serif" font-size="86" font-weight="900" fill="#ffffff">
      VIỆT NAM <tspan fill="url(#goldText)">ĐẤT NƯỚC TA ƠI</tspan>
    </text>

    <text x="0" y="228" font-family="'Segoe UI', Arial, sans-serif" font-size="34" font-weight="800" fill="#fcd34d" letter-spacing="1">
      BẢN ĐỒ 34 TỈNH THÀNH &amp; BIỂN ĐẢO QUÊ HƯƠNG • DUONG BIRKEN
    </text>
  </g>
</svg>
