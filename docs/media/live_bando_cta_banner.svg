<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 760" width="2400" height="760">
  <defs>
    <linearGradient id="ctaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#190a06"/>
      <stop offset="50%" stop-color="#2e130c"/>
      <stop offset="100%" stop-color="#120704"/>
    </linearGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff0b8"/>
      <stop offset="50%" stop-color="#e0b452"/>
      <stop offset="100%" stop-color="#9c6e1e"/>
    </linearGradient>
    <linearGradient id="btnRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b3261e"/>
      <stop offset="50%" stop-color="#dc362e"/>
      <stop offset="100%" stop-color="#9c1f18"/>
    </linearGradient>
    <linearGradient id="btnGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d49b2a"/>
      <stop offset="50%" stop-color="#f5c451"/>
      <stop offset="100%" stop-color="#b8821c"/>
    </linearGradient>
    <linearGradient id="btnJade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#13603f"/>
      <stop offset="50%" stop-color="#1e8a5c"/>
      <stop offset="100%" stop-color="#0e4a30"/>
    </linearGradient>
    <linearGradient id="cardFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#28120c" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#160906" stop-opacity="0.96"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="2400" height="760" fill="url(#ctaBg)"/>

  <!-- Outer Lacquer Gold Frame -->
  <rect x="28" y="28" width="2344" height="704" rx="34" fill="none" stroke="url(#goldBorder)" stroke-width="4"/>
  <rect x="44" y="44" width="2312" height="672" rx="26" fill="none" stroke="#e0b452" stroke-width="1.5" stroke-dasharray="10 10" opacity="0.45"/>

  <!-- Top Header Call To Action (Segoe UI for clean Vietnamese diacritics and safe margins) -->
  <text x="1200" y="114" font-family="'Segoe UI', Arial, sans-serif" font-size="44" font-weight="900" fill="#fff3dc" text-anchor="middle">
    SẴN SÀNG THẮP SÁNG BẢN ĐỒ 34 TỈNH THÀNH TRÊN TIKTOK LIVE CỦA BẠN?
  </text>
  <text x="1200" y="164" font-family="'Segoe UI', Arial, sans-serif" font-size="25" font-weight="600" fill="#e0b452" text-anchor="middle">
    Hoàn toàn miễn phí · Mã nguồn mở minh bạch · Tích hợp sẵn Node.js &amp; Giọng MC AI Tiếng Việt tự động 100%
  </text>

  <!-- 3 CTA ACTION CARDS -->
  <!-- CARD 1: 1-CLICK WINDOWS EXE INSTALLER -->
  <g transform="translate(80, 210)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="720" height="430" rx="28" fill="url(#cardFill)" stroke="url(#goldBorder)" stroke-width="3"/>
    <rect x="210" y="28" width="300" height="46" rx="23" fill="#4a1610" stroke="#ff9e80" stroke-width="1.5"/>
    <text x="360" y="58" font-family="'Segoe UI', Arial, sans-serif" font-size="19" font-weight="800" fill="#ffd27a" text-anchor="middle">BƯỚC 1 · KHUYÊN DÙNG</text>

    <text x="360" y="128" font-family="'Segoe UI', Arial, sans-serif" font-size="32" font-weight="800" fill="#fff3dc" text-anchor="middle">
      💿 Tải Bộ Cài Windows 1-Click
    </text>
    <text x="360" y="174" font-family="'Segoe UI', Arial, sans-serif" font-size="21" font-weight="600" fill="#d7c5ae" text-anchor="middle">
      Đã nhúng sẵn Node.js Runtime + Bản đồ 34 tỉnh
    </text>
    <text x="360" y="208" font-family="'Segoe UI', Arial, sans-serif" font-size="21" font-weight="600" fill="#d7c5ae" text-anchor="middle">
      Tự tạo icon ngoài Desktop, bấm đúp chạy ngay!
    </text>

    <!-- CTA Button 1 -->
    <rect x="40" y="252" width="640" height="88" rx="22" fill="url(#btnRed)" stroke="#ffdd00" stroke-width="3"/>
    <text x="360" y="292" font-family="'Segoe UI', Arial, sans-serif" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle">
      TẢI NGAY BỘ CÀI ĐẶT WINDOWS 1-CLICK (.EXE)
    </text>
    <text x="360" y="324" font-family="'Segoe UI', Arial, sans-serif" font-size="19" font-weight="700" fill="#ffe49e" text-anchor="middle">
      Viet-Nam-Dat-Nuoc-Ta-Oi-Setup-v1.0.exe
    </text>
    <text x="360" y="388" font-family="'Segoe UI', Arial, sans-serif" font-size="19" font-weight="600" fill="#e0b452" text-anchor="middle">
      Hoặc chạy trực tiếp bằng BAT-LIVE.bat trong thư mục mã nguồn
    </text>
  </g>

  <!-- CARD 2: STAR ON GITHUB -->
  <g transform="translate(840, 210)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="720" height="430" rx="28" fill="url(#cardFill)" stroke="url(#goldBorder)" stroke-width="3"/>
    <rect x="210" y="28" width="300" height="46" rx="23" fill="#3d2b0c" stroke="#ffd27a" stroke-width="1.5"/>
    <text x="360" y="58" font-family="'Segoe UI', Arial, sans-serif" font-size="19" font-weight="800" fill="#ffdd00" text-anchor="middle">BƯỚC 2 · ỦNG HỘ DỰ ÁN</text>

    <text x="360" y="128" font-family="'Segoe UI', Arial, sans-serif" font-size="32" font-weight="800" fill="#fff3dc" text-anchor="middle">
      ⭐ Tặng 1 Star Trên GitHub
    </text>
    <text x="360" y="174" font-family="'Segoe UI', Arial, sans-serif" font-size="21" font-weight="600" fill="#d7c5ae" text-anchor="middle">
      Tiếp thêm động lực phát triển thêm nhiều giao diện
    </text>
    <text x="360" y="208" font-family="'Segoe UI', Arial, sans-serif" font-size="21" font-weight="600" fill="#d7c5ae" text-anchor="middle">
      &amp; kho câu kể đặc sản quê hương Việt Nam mới!
    </text>

    <!-- CTA Button 2 -->
    <rect x="40" y="252" width="640" height="88" rx="22" fill="url(#btnGold)" stroke="#fff6cc" stroke-width="2.5"/>
    <text x="360" y="292" font-family="'Segoe UI', Arial, sans-serif" font-size="22" font-weight="900" fill="#1a0d06" text-anchor="middle">
      TẶNG 1 NGÔI SAO (STAR) TRÊN GITHUB
    </text>
    <text x="360" y="324" font-family="'Segoe UI', Arial, sans-serif" font-size="19" font-weight="800" fill="#3a160e" text-anchor="middle">
      github.com/duongbirken2510/LIVE-Bando
    </text>
    <text x="360" y="388" font-family="'Segoe UI', Arial, sans-serif" font-size="19" font-weight="600" fill="#e0b452" text-anchor="middle">
      Fork &amp; Watch để nhận thông báo khi có bản cập nhật mới
    </text>
  </g>

  <!-- CARD 3: AUTHOR WEBSITE & ECOSYSTEM -->
  <g transform="translate(1600, 210)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="720" height="430" rx="28" fill="url(#cardFill)" stroke="url(#goldBorder)" stroke-width="3"/>
    <rect x="200" y="28" width="320" height="46" rx="23" fill="#0d3523" stroke="#9ff0c3" stroke-width="1.5"/>
    <text x="360" y="58" font-family="'Segoe UI', Arial, sans-serif" font-size="19" font-weight="800" fill="#9ff0c3" text-anchor="middle">BƯỚC 3 · KẾT NỐI TÁC GIẢ</text>

    <text x="360" y="128" font-family="'Segoe UI', Arial, sans-serif" font-size="32" font-weight="800" fill="#fff3dc" text-anchor="middle">
      🌐 Duong Birken Studio
    </text>
    <text x="360" y="174" font-family="'Segoe UI', Arial, sans-serif" font-size="21" font-weight="600" fill="#d7c5ae" text-anchor="middle">
      Khám phá hệ sinh thái Game TikTok LIVE tự động:
    </text>
    <text x="360" y="208" font-family="'Segoe UI', Arial, sans-serif" font-size="21" font-weight="600" fill="#d7c5ae" text-anchor="middle">
      Kỳ Tài Chữ Việt · Phở Cô Ba 3D · Đua Ghe · Đuổi Hình
    </text>

    <!-- CTA Button 3 -->
    <rect x="40" y="252" width="640" height="88" rx="22" fill="url(#btnJade)" stroke="#9ff0c3" stroke-width="2.5"/>
    <text x="360" y="292" font-family="'Segoe UI', Arial, sans-serif" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle">
      GHÉ THĂM WEBSITE CHÍNH THỨC TÁC GIẢ
    </text>
    <text x="360" y="324" font-family="'Segoe UI', Arial, sans-serif" font-size="19" font-weight="700" fill="#c7f9e0" text-anchor="middle">
      https://duongbirken.deta.vn
    </text>
    <text x="360" y="388" font-family="'Segoe UI', Arial, sans-serif" font-size="19" font-weight="600" fill="#9ff0c3" text-anchor="middle">
      Liên hệ hợp tác, góp ý tính năng &amp; hỗ trợ kỹ thuật
    </text>
  </g>

  <!-- Bottom Footer Bar -->
  <text x="1200" y="694" font-family="'Segoe UI', Arial, sans-serif" font-size="22" font-weight="700" fill="#c9b69c" text-anchor="middle">
    Việt Nam Đất Nước Ta Ơi (LIVE-BANDO)  •  Crafted with Passion by Duong Birken (https://duongbirken.deta.vn)
  </text>
</svg>
